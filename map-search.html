<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Google Maps Search</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            max-width: 800px;
            margin: 30px auto;
            padding: 0 20px;
        }

        label {
            display: block;
            margin-top: 15px;
        }

        input {
            padding: 8px;
            width: 250px;
            max-width: 90%;
        }

        button {
            margin-top: 15px;
            padding: 9px 20px;
            background-color: #2166ac;
            color: white;
            border: 0;
            cursor: pointer;
        }

        #message {
            color: #b00020;
        }

        iframe {
            width: 100%;
            height: 450px;
            border: 1px solid #aaa;
        }
    </style>
</head>
<body>
    <h1>Google Maps Search</h1>
    <p>Enter a street and a city to find them on the map.</p>

    <form onsubmit="searchMap(); return false;">
        <label for="street">Street:</label>
        <input type="text" id="street" placeholder="e.g. Baker Street" required>

        <label for="city">City:</label>
        <input type="text" id="city" placeholder="e.g. London" required>

        <br>
        <button type="submit">Search</button>
    </form>

    <p id="message" role="status"></p>

    <iframe id="map" title="Google map showing the searched address"
        src="https://maps.google.com/maps?q=London&amp;output=embed"
        allowfullscreen>
    </iframe>


    <script>
        function searchMap() {
            let street = document.getElementById("street").value.trim();
            let city = document.getElementById("city").value.trim();

            if (street === "" || city === "") {
                document.getElementById("message").textContent = "Please enter both a street and a city.";
                return;
            }

            document.getElementById("message").textContent = "";

            let address = encodeURIComponent(street + ", " + city);

            document.getElementById("map").src = "https://maps.google.com/maps?q=" + address + "&output=embed";
        }
    </script>
</body>
</html>
